
<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melee Web</title>
<link rel="icon" href="data:,">

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 12px;
    background: #111;
    color: #eee;
    font: 15px/1.4 system-ui, sans-serif;
  }

  h1 { margin: 0 0 10px; }

  #bar {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    margin: 12px 0;
  }

  #stats {
    margin-left: auto;
    color: #9c9;
    font-variant-numeric: tabular-nums;
  }

  #status { color: #fc6; }

  #screen {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
  }

  canvas {
    display: block;
    width: min(100%, calc((100vh - 150px) * 4 / 3));
    height: auto;
    aspect-ratio: 4 / 3;
    background: #000;
  }

  #fullscreen {
    padding: 7px 12px;
    cursor: pointer;
  }

  #screen:fullscreen {
    width: 100%;
    height: 100%;
  }

  #screen:fullscreen canvas {
    width: min(100vw, calc(100vh * 4 / 3));
    height: auto;
    max-height: 100%;
  }

  pre {
    white-space: pre-wrap;
    color: #999;
    font-size: 12px;
    max-height: 14em;
    overflow: auto;
  }

  kbd {
    background: #333;
    border-radius: 3px;
    padding: 0 4px;
  }
</style>

<h1>Melee Web</h1>

<div id="bar">
  <input id="disc" type="file" accept=".iso,.gcm">
  <button id="start" disabled>Start</button>
  <button id="fullscreen" type="button">Pantalla completa</button>
  <span id="status">Loading engine…</span>
  <span id="stats"></span>
</div>

<div id="screen">
  <canvas id="canvas" width="960" height="720" tabindex="0"></canvas>
</div>

<p>
  <kbd>Arrows</kbd> stick · <kbd>X</kbd> A · <kbd>Z</kbd> B ·
  <kbd>C</kbd> X · <kbd>V</kbd> Y · <kbd>Q</kbd> L ·
  <kbd>E</kbd> R · <kbd>Tab</kbd> Z · <kbd>Enter</kbd> Start ·
  <kbd>I</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd> C-stick
</p>

<pre id="log"></pre>

<script>
  const screen = document.getElementById('screen');
  const fullscreenButton = document.getElementById('fullscreen');

  fullscreenButton.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) {
        await screen.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (error) {
      console.error(error);
    }
  });

  document.addEventListener('fullscreenchange', () => {
    fullscreenButton.textContent = document.fullscreenElement
      ? 'Salir de pantalla completa'
      : 'Pantalla completa';
  });
</script>

<script type="module" src="./shell.mjs"></script>
</html>
